[build]
  publish = "dist"
  command = "npm run build"

# Patio & Driveway Cleaning was removed as a combined service (kept patio-cleaning
# and driveway-cleaning separately). Redirect the previously-indexed URLs rather
# than letting them 404, to preserve their SEO value.
[[redirects]]
  from = "/patio-driveway-cleaning"
  to = "/patio-cleaning"
  status = 301

[[redirects]]
  from = "/ardrossan/patio-driveway-cleaning"
  to = "/ardrossan/patio-cleaning"
  status = 301

[[redirects]]
  from = "/ayr/patio-driveway-cleaning"
  to = "/ayr/patio-cleaning"
  status = 301

